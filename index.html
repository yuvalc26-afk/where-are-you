<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Where R U?</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="style.css?v=2026-11-11.1953">
</head>
<body>
  <header class="topbar">
    <div class="brand"><bdi>Where R U?</bdi></div>
    <div class="connect">
      <button id="btnBle" class="primary">חבר BLE</button>
      <button id="btnUsb" hidden>חבר USB</button>
      <button id="btnDemo" class="ghost">דמו</button>
      <button id="btnDisconnect" class="ghost" hidden>נתק</button>
    </div>
    <div class="chips">
      <span id="chipDongle" class="chip off"><bdi>Where R U?</bdi>: לא מחובר</span>
      <span id="chipNode" class="chip off"><bdi>I_M_Here</bdi>: לא ידוע</span>
      <span id="chipBusy" class="chip busy" hidden>עובד…</span>
    </div>
  </header>

  <div id="notice" class="notice" role="alert" hidden></div>

  <main class="layout">
    <section class="map-wrap">
      <div id="map"></div>
      <div class="map-tools">
        <button id="btnFit" title="הצג את שניהם">⤢</button>
        <button id="btnMe" title="המיקום שלי">◎</button>
      </div>
    </section>

    <section class="panel">
      <div class="card nav">
        <div class="arrow-box">
          <svg id="arrow" viewBox="0 0 100 100" aria-hidden="true">
            <path d="M50 6 L80 90 L50 72 L20 90 Z"></path>
          </svg>
        </div>
        <div class="nav-text">
          <div id="distance" class="distance">—</div>
          <div id="bearing" class="muted">אין עדיין מיקום של <bdi>I_M_Here</bdi></div>
          <div id="fixAge" class="muted"></div>
        </div>
        <a id="btnNavigate" class="button ghost" target="_blank" rel="noopener" hidden>נווט</a>
      </div>

      <div class="card">
        <h2>פקודות</h2>
        <div class="actions">
          <button data-cmd="get_last">מיקום אחרון</button>
          <div class="combo">
            <button data-cmd="ping">פינג / בדיקת קשר</button>
            <button id="btnPingLoop" class="loop" type="button">פינג רצוף ▶</button>
          </div>
          <div id="linkQ" class="linkq">
            <div class="q-row"><span class="q-dir">קליטה ב-<bdi>Where R U?</bdi></span><span id="qDown" class="q-val">—</span><span id="qDownScore" class="q-score">–</span></div>
            <div class="q-row"><span class="q-dir">קליטה ב-<bdi>I_M_Here</bdi></span><span id="qUp" class="q-val">—</span><span id="qUpScore" class="q-score">–</span></div>
          </div>
          <div id="pingStats" class="ping-stats" hidden></div>
          <div id="rfTools" class="rf-tools" hidden>
            <button id="btnCalib" type="button">כיול: אני ליד <bdi>I_M_Here</bdi></button>
            <button id="btnRfClear" type="button">נקה דגימות</button>
          </div>
          <div class="gps-box">
            <button data-cmd="gps_fix">בדוק GPS עכשיו</button>
            <div class="gps-opts">
              <label>חיפוש עד
                <select id="gpsTimeout">
                  <option value="30">30 ש׳</option>
                  <option value="60">1 דק׳</option>
                  <option value="90">1.5 דק׳</option>
                  <option value="120" selected>2 דק׳</option>
                  <option value="150">2.5 דק׳</option>
                  <option value="180">3 דק׳</option>
                  <option value="210">3.5 דק׳</option>
                  <option value="240">4 דק׳</option>
                  <option value="270">4.5 דק׳</option>
                  <option value="300">5 דק׳</option>
                  <option value="330">5.5 דק׳</option>
                  <option value="360">6 דק׳</option>
                  <option value="390">6.5 דק׳</option>
                  <option value="420">7 דק׳</option>
                </select>
              </label>
              <label>אחרי מיקום ראשון
                <select id="gpsWindow">
                  <option value="0" selected>לעצור מיד</option>
                  <option value="30">לעדכן 30 ש׳</option>
                  <option value="60">לעדכן דקה</option>
                  <option value="120">לעדכן 2 דק׳</option>
                  <option value="300">לעדכן 5 דק׳</option>
                </select>
              </label>
            </div>
          </div>
          <div class="combo">
            <button data-cmd="buzz">צפצף 🔊</button>
            <select id="buzzSeconds" aria-label="משך הצפצוף">
              <option value="5">5 ש׳</option>
              <option value="10" selected>10 ש׳</option>
              <option value="30">30 ש׳</option>
              <option value="60">דקה</option>
              <option value="300">5 דק׳</option>
              <option value="600">10 דק׳</option>
              <option value="0">עצור</option>
            </select>
          </div>
        </div>
      </div>

      <div class="card">
        <h2>המיקום של <bdi>I_M_Here</bdi></h2>
        <dl id="fixDetails" class="details"><dt>—</dt><dd>עוד לא התקבל מיקום</dd></dl>
      </div>

      <div class="card">
        <h2>קשר LoRa</h2>
        <div class="rate">
          <span class="muted">קצב קבוע: הכי איטי ועמיד (SF12)</span>
          <label>עוצמת שידור
            <select id="power">
              <option>2</option><option>8</option><option>14</option><option>20</option><option selected>22</option>
            </select> dBm
          </label>
        </div>
        <dl id="linkDetails" class="details"><dt>—</dt><dd>אין נתונים</dd></dl>
      </div>

      <details class="card log">
        <summary>לוג <span id="appVer" class="muted"></span></summary>
        <div id="log"></div>
      </details>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="app.js?v=2026-11-11.1953"></script>
</body>
</html>
